name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install the Android NDK that Flutter needs
        # Otherwise Gradle downloads the ~700 MB NDK in the middle of the
        # build, and one corrupt download ("Error on ZipFile unknown archive")
        # fails the whole release. Install it up front, retrying.
        run: |
          ext="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          ndk="$(grep -oE 'val ndkVersion: String = "[0-9.]+"' "$ext" 2>/dev/null | grep -oE '[0-9][0-9.]+' || true)"
          if [ -z "$ndk" ]; then
            echo "::warning::Could not read Flutter's NDK version; Gradle will install it."
            exit 0
          fi
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -f "$sdk/ndk/$ndk/source.properties" ]; then
            echo "NDK $ndk is already installed."
            exit 0
          fi
          for attempt in 1 2 3; do
            rm -rf "$sdk/ndk/$ndk"
            if yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null \
                && [ -f "$sdk/ndk/$ndk/source.properties" ]; then
              echo "NDK $ndk installed."
              exit 0
            fi
            echo "NDK download attempt $attempt failed, retrying…"
            sleep 15
          done
          echo "::error::Could not install NDK $ndk"
          exit 1

      - name: Validate production API URL
        run: |
          # A repository variable edited in the browser can carry a trailing
          # newline; passed on as-is it turns the whole --dart-define into an
          # unparsable argument ("Target file ... not found").
          url="$(printf '%s' "$API_BASE_URL" | tr -d '[:space:]')"
          if [[ "$url" != https://* ]]; then
            echo "Repository variable API_BASE_URL must be a non-empty HTTPS URL" >&2
            exit 1
          fi
          echo "API_BASE_URL=$url" >> "$GITHUB_ENV"

      - name: Build release APK
        # No signing keystore is configured for this project yet, so the APK
        # carries the debug key: installable for testing, not publishable.
        env:
          ALLOW_DEBUG_SIGNING: "1"
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/andromeda_app-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/andromeda_app-${{ github.ref_name }}.apk
