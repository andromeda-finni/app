name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate production API URL
        run: |
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo "Repository variable API_BASE_URL must be a non-empty HTTPS URL" >&2
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/andromeda_app-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/andromeda_app-${{ github.ref_name }}.apk
