name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Keystore for CI
        run: |
          keytool -genkeypair -v \
            -keystore android/app/keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias uploadKey \
            -storepass finniPass123 \
            -keypass finniPass123 \
            -dname "CN=Andromeda, OU=Dev, O=Finni, L=Moscow, C=RU"
          cat <<EOF > android/key.properties
          storeFile=$GITHUB_WORKSPACE/android/app/keystore.jks
          storePassword=finniPass123
          keyAlias=uploadKey
          keyPassword=finniPass123
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
