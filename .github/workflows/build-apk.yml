name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Keystore for CI
        run: |
          keytool -genkeypair -v \
            -keystore android/app/keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias uploadKey \
            -storepass finniPass123 \
            -keypass finniPass123 \
            -dname "CN=Andromeda, OU=Dev, O=Finni, L=Moscow, C=RU"
          cat <<EOF > android/key.properties
          storeFile=$GITHUB_WORKSPACE/android/app/keystore.jks
          storePassword=finniPass123
          keyAlias=uploadKey
          keyPassword=finniPass123
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Validate production API URL
        run: |
          # A repository variable edited in the browser can carry a trailing
          # newline; passed on as-is it turns the whole --dart-define into an
          # unparsable argument ("Target file ... not found").
          url="$(printf '%s' "$API_BASE_URL" | tr -d '[:space:]')"
          if [[ "$url" != https://* ]]; then
            echo "Repository variable API_BASE_URL must be a non-empty HTTPS URL" >&2
            exit 1
          fi
          echo "API_BASE_URL=$url" >> "$GITHUB_ENV"

      - name: Build release APK
        # No signing keystore is configured for this project yet, so the APK
        # carries the debug key: installable for testing, not publishable.
        env:
          ALLOW_DEBUG_SIGNING: "1"
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
